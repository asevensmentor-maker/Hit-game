<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Progressive Face Tap Hit</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial;color:#fff}
body{display:flex;justify-content:center}.game{width:min(100vw,620px);height:100vh;position:relative;overflow:hidden;background:#ddd;touch-action:none}
.stage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .15s}
.top{position:absolute;z-index:10;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:7px}
.stat{background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:7px 13px;text-align:center}.label{font-size:10px;opacity:.75}.value{font-size:21px;font-weight:900}
.msg{position:absolute;z-index:12;top:72px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(0,0,0,.56);border-radius:999px;padding:8px 15px;font-size:13px}
.start,.again{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:999px;padding:16px 30px;font-size:19px;font-weight:900}
.stageText{position:absolute;z-index:12;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.58);padding:8px 15px;border-radius:999px;font-weight:800;white-space:nowrap}
.rage{position:absolute;z-index:12;left:10px;top:125px;width:10px;height:150px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden}.rage i{position:absolute;left:0;bottom:0;width:100%;height:0;background:#f33;transition:height .18s}
.shake{animation:shake .22s ease-out}@keyframes shake{0%{transform:translate(0)}25%{transform:translate(-8px,2px)}50%{transform:translate(8px,-2px)}75%{transform:translate(-5px,1px)}100%{transform:translate(0)}}
.impact{position:absolute;z-index:20;width:76px;height:76px;margin:-38px;border:5px solid #fff;border-radius:50%;animation:impact .36s ease-out forwards;pointer-events:none}.impact:before,.impact:after{content:"";position:absolute;left:50%;top:50%;height:58px;width:5px;background:#fff}.impact:before{transform:translate(-50%,-50%) rotate(45deg)}.impact:after{transform:translate(-50%,-50%) rotate(-45deg)}
@keyframes impact{from{opacity:1;transform:scale(.25)}to{opacity:0;transform:scale(1.7)}}
.pow{position:absolute;z-index:25;font-size:38px;font-weight:1000;text-shadow:0 3px 8px #000;animation:pow .55s ease-out forwards;pointer-events:none}@keyframes pow{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80px) scale(.9)}}
.flash{position:absolute;z-index:15;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:flash .1s ease-out}@keyframes flash{from{opacity:.45}to{opacity:0}}
.end{position:absolute;z-index:40;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}.panel{width:86%;max-width:350px;background:#181818;border:1px solid #555;border-radius:22px;padding:28px;text-align:center}.big{font-size:54px;font-weight:1000;margin:8px}
</style></head>
<body><div class="game" id="game">
<img id="face" class="stage" alt="Progressive face reaction">
<div class="top"><div class="stat"><div class="label">HITS</div><div id="hits" class="value">0</div></div><div class="stat"><div class="label">COMBO</div><div id="combo" class="value">0</div></div><div class="stat"><div class="label">TIME</div><div id="time" class="value">30</div></div></div>
<div id="msg" class="msg">Press START</div><div class="rage"><i id="rageFill"></i></div>
<button id="start" class="start">START GAME</button><div id="flash" class="flash"></div><div id="stageText" class="stageText">NORMAL</div>
<div id="end" class="end"><div class="panel"><h2>Game Over</h2><div class="label">TOTAL HITS</div><div id="final" class="big">0</div><div id="best"></div><br><button id="again" class="again">PLAY AGAIN</button></div></div>
</div>

const names=["NORMAL","FIRST HIT","OUCH!","HURTS!","SO BAD!","VERY BAD!","KO!"];
const game=document.getElementById("game"),face=document.getElementById("face"),start=document.getElementById("start"),again=document.getElementById("again"),hitsEl=document.getElementById("hits"),comboEl=document.getElementById("combo"),timeEl=document.getElementById("time"),msg=document.getElementById("msg"),stageText=document.getElementById("stageText"),rage=document.getElementById("rageFill"),flash=document.getElementById("flash"),end=document.getElementById("end"),final=document.getElementById("final"),best=document.getElementById("best");
let running=false,hits=0,combo=0,bestCombo=0,time=30,last=0,timer;
function begin(){running=true;hits=0;combo=0;bestCombo=0;time=30;last=0;face.src=imgs[0];hitsEl.textContent=0;comboEl.textContent=0;timeEl.textContent=30;rage.style.height="0%";stageText.textContent=names[0];msg.textContent="Tap the photo!";start.style.display="none";end.style.display="none";clearInterval(timer);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000)}
function finish(){running=false;clearInterval(timer);final.textContent=hits;best.textContent="Best combo: "+bestCombo;end.style.display="flex"}
function tap(e){if(!running)return;e.preventDefault();let now=performance.now();combo=(now-last<850)?combo+1:1;last=now;hits++;bestCombo=Math.max(bestCombo,combo);hitsEl.textContent=hits;comboEl.textContent=combo;
let idx=Math.min(Math.floor((hits-1)/2),6);face.src=imgs[idx];stageText.textContent=names[idx];rage.style.height=(idx/6*100)+"%";
face.classList.remove("shake");void face.offsetWidth;face.classList.add("shake");flash.classList.remove("on");void flash.offsetWidth;flash.classList.add("on");
let r=game.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let ring=document.createElement("div");ring.className="impact";ring.style.left=x+"px";ring.style.top=y+"px";game.appendChild(ring);setTimeout(()=>ring.remove(),420);
let p=document.createElement("div");p.className="pow";p.textContent=idx>=6?"KO!":idx>=4?"POW!":idx>=2?"OUCH!":"HIT!";p.style.left=x+"px";p.style.top=(y-10)+"px";game.appendChild(p);setTimeout(()=>p.remove(),600);msg.textContent=idx>=6?"💥 KO REACTION!":combo>=5?"🔥 "+combo+" HIT COMBO!":"Hit!"}
